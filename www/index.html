<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPGM Translator</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#14161c;color:#e8e8ee}
h1{font-size:20px;margin:0 0 4px}
p.s{color:#9aa;font-size:13px;margin:0 0 14px}
label{display:block;font-size:13px;margin:12px 0 4px;color:#bcd}
select,input[type=file]{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1f2230;color:#fff;box-sizing:border-box}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:16px;font-weight:600}
button:disabled{opacity:.5}
progress{width:100%;height:14px}
#log{margin-top:12px;font:12px/1.5 monospace;white-space:pre-wrap;background:#0d0f14;padding:10px;border-radius:8px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<h1>RPGM Translator</h1>
<p class="s">Terjemahkan file JSON game RPG Maker MV/MZ (folder <b>www/data</b> atau <b>data</b>).</p>

<label>Bahasa asal</label>
<select id="sl"><option value="auto">Otomatis</option><option value="ja">Jepang</option><option value="en">Inggris</option><option value="zh-CN">Mandarin</option><option value="ko">Korea</option></select>

<label>Bahasa tujuan</label>
<select id="tl"><option value="id">Indonesia</option><option value="en">Inggris</option></select>

<label>Pilih file JSON (bisa banyak: Map001.json, Items.json, System.json, dst.)</label>
<input type="file" id="files" multiple accept=".json,application/json">

<button id="go">Mulai Terjemahkan</button>
<div id="pct" style="margin-top:14px;font-size:22px;font-weight:700">0%</div>
<div id="sub" style="font-size:12px;color:#9aa;margin-bottom:4px">Menunggu</div>
<progress id="bar" value="0" max="100"></progress>
<button id="retry" style="display:none;background:#2f9e6b">Simpan ulang yang gagal</button>
<div id="log">Siap.</div>

<script>
const $=id=>document.getElementById(id);
const logEl=$('log');
const lines=[];
const log=m=>{lines.push(m);if(lines.length>40)lines.shift();logEl.textContent=lines.join('\n');logEl.scrollTop=logEl.scrollHeight};
const DS=window.Capacitor&&Capacitor.registerPlugin?Capacitor.registerPlugin('DownloadSaver'):null;
const failed=[];

const CC=/\\[A-Za-z]+\[\d*\]|\\[.!|<>^{}$]|\\[A-Za-z]|%\d+/g;
const DB=/^(Actors|Classes|Items|Weapons|Armors|Skills|States|Enemies)$/;
const DBKEYS=new Set(['name','description','message1','message2','message3','message4','nickname','profile']);
const cache=new Map();

function protect(s){const m=[];const t=s.replace(CC,x=>{m.push(x);return '\u27e6'+(m.length-1)+'\u27e7'});return {t,m}}
function restore(t,m){
  let n=0;
  const r=t.replace(/\u27e6\s*(\d+)\s*\u27e7/g,(a,i)=>{n++;return m[i]??''});
  return n===m.length?r:null;
}
async function gt(text,sl,tl){
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(text);
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(url);
      const d=await r.json();
      return d[0].map(x=>x[0]).join('');
    }catch(e){await new Promise(r=>setTimeout(r,800*(i+1)))}
  }
  return null;
}
async function tr(s,sl,tl){
  if(!/\p{L}/u.test(s.replace(CC,'')))return s;
  const key=sl+tl+s;
  if(cache.has(key))return cache.get(key);
  const {t,m}=protect(s);
  const out=await gt(t,sl,tl);
  let res=s;
  if(out){const r=restore(out,m);if(r!==null)res=r}
  cache.set(key,res);
  return res;
}

function collect(node,out,keys){
  if(Array.isArray(node)){node.forEach(n=>collect(n,out,keys));return}
  if(!node||typeof node!=='object')return;
  if(typeof node.code==='number'&&Array.isArray(node.parameters)){
    const p=node.parameters;
    if((node.code===401||node.code===405)&&typeof p[0]==='string')out.push([p,0]);
    else if(node.code===402&&typeof p[1]==='string')out.push([p,1]);
    else if(node.code===102&&Array.isArray(p[0]))p[0].forEach((v,i)=>{if(typeof v==='string')out.push([p[0],i])});
    return;
  }
  for(const k in node){
    const v=node[k];
    if(typeof v==='string'){if(keys.has(k))out.push([node,k])}
    else if(v&&typeof v==='object')collect(v,out,keys);
  }
}
function collectAllStrings(node,out){
  if(Array.isArray(node))node.forEach((v,i)=>typeof v==='string'?out.push([node,i]):collectAllStrings(v,out));
  else if(node&&typeof node==='object')for(const k in node){const v=node[k];typeof v==='string'?out.push([node,k]):collectAllStrings(v,out)}
}
function gather(base,data){
  const out=[];
  if(DB.test(base))collect(data,out,DBKEYS);
  else if(base==='System'){
    for(const k of ['gameTitle','currencyUnit'])if(typeof data[k]==='string')out.push([data,k]);
    if(data.terms)collectAllStrings(data.terms,out);
  }else collect(data,out,new Set(['displayName']));
  return out;
}
async function pool(items,n,fn){
  let i=0;
  await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const j=i++;await fn(items[j],j)}}));
}
async function save(name,text){
  if(!DS)throw new Error('plugin simpan tidak ada');
  const r=await DS.save({name,data:text,folder:'rpgmtranslate'});
  return r.path;
}
function setProgress(fi,total,frac,name){
  const p=(fi+frac)/total*100;
  $('bar').value=p;
  $('pct').textContent=p.toFixed(1)+'%';
  $('sub').textContent='File '+(fi+1)+' dari '+total+' · '+name+' ('+Math.round(frac*100)+'%)';
}
async function retryFailed(){
  const list=failed.splice(0);
  let ok=0;
  for(const f of list){
    try{await save(f.name,f.text);ok++}catch(e){failed.push(f)}
  }
  log('Simpan ulang: '+ok+' berhasil, '+failed.length+' masih gagal');
  $('retry').style.display=failed.length?'block':'none';
}
$('retry').onclick=retryFailed;

$('go').onclick=async()=>{
  const files=[...$('files').files];
  if(!files.length){log('Pilih file JSON dulu.');return}
  const sl=$('sl').value,tl=$('tl').value;
  $('go').disabled=true;
  try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}
  failed.length=0;$('retry').style.display='none';
  let okCount=0;
  for(let fi=0;fi<files.length;fi++){
    const f=files[fi];
    const base=f.name.replace(/\.json$/i,'');
    try{
      setProgress(fi,files.length,0,f.name);
      const data=JSON.parse(await f.text());
      const refs=gather(base,data);
      let done=0;
      await pool(refs,6,async([o,k])=>{
        o[k]=await tr(o[k],sl,tl);
        done++;
        if(done%5===0||done===refs.length)setProgress(fi,files.length,done/refs.length,f.name);
      });
      const text=JSON.stringify(data);
      try{
        await save(f.name,text);
        okCount++;
        log('OK  '+f.name+' ('+refs.length+' teks)');
      }catch(e){
        failed.push({name:f.name,text});
        log('GAGAL simpan '+f.name+': '+e.message);
      }
    }catch(e){log('GAGAL '+f.name+': '+e.message)}
  }
  setProgress(files.length-1,files.length,1,'selesai');
  $('pct').textContent='100%';
  log('\nSelesai: '+okCount+'/'+files.length+' tersimpan di Download/rpgmtranslate');
  if(failed.length)$('retry').style.display='block';
  $('go').disabled=false;
};
</script>
</body>
</html>
